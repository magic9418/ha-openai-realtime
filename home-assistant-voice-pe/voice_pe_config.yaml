# ESPHome Configuration for Home Assistant Voice PE Hardware (OpenAI Realtime)
# 
# This configuration is ready to compile and install on Voice PE hardware
#
# Hardware Specifications (Home Assistant Voice PE):
# - ESP32-S3 with PSRAM
# - Integrated I2S microphone (GPIO15)
# - Integrated I2S speaker/amplifier (GPIO10)
# - LED Ring (GPIO21, WS2812, 12 LEDs)
# - Center Button (GPIO0)
# - Hardware Mute Switch (GPIO3)
# - Audio Jack Detection (GPIO17)
# - Internal Speaker Amp (GPIO47)
#
# CONFIGURATION REQUIRED:
# 1. Create secrets.yaml (copy from secrets.yaml.example) with:
#    wifi_ssid: "Your WiFi SSID"
#    wifi_password: "Your WiFi Password"
#    api_encryption_key: "Your Home Assistant API encryption key"
#    ota_password: "Your OTA password"
#
# 2. Edit the server_url in secrets.yaml with your Home Assistant IP and port:
#    server_url: "ws://192.168.1.10:8080"  # Replace with your values
#
# 3. Adjust device name if needed (currently: ha-voice-openai)
#
# 4. Compile and install:
#    esphome compile voice_pe_config.yaml
#    esphome upload voice_pe_config.yaml

substitutions:
  esp32_fw_version: neo-2026.09.30-penny-dropin-dial-v5
  neo_intercom_device_id: office-voice-pe
  # Voice Assistant Phase IDs (for state management)
  voice_assist_idle_phase_id: '1'
  voice_assist_waiting_for_command_phase_id: '2'
  voice_assist_listening_for_command_phase_id: '3'
  voice_assist_thinking_phase_id: '4'
  voice_assist_replying_phase_id: '5'
  voice_assist_not_ready_phase_id: '10'
  voice_assist_error_phase_id: '11'
  # Server URL is now defined in secrets.yaml as server_url
  # Sound file for wake word (local file)
  wake_word_triggered_sound_file: wake_sound.flac
  # NOTE: there used to be a `wake_open_delay_ms: 320ms` substitution here. It was never actually
  # referenced by any component field (dead — `grep '\${wake_open_delay_ms}'` turns up nothing),
  # so it could silently drift from the value that's actually live and mislead anyone tuning this.
  # The real mic-open delay is a single knob: the component's compiled-in default (see the C++
  # header — flag any mismatch there to the C++ agent) UNLESS overridden at runtime by the
  # session-server's `{"type":"hello","wake_open_delay_ms":N}` frame
  # (SESSION_WAKE_OPEN_DELAY_MS in session_server/settings.py, currently 200). Tune it there, not
  # in this YAML.
  # Primary wake word model. Change this in one place to swap the wake word.
  # Accepts either:
  #   - a microWakeWord v2 shorthand name (okay_nabu, hey_jarvis, hey_mycroft, hey_rhasspy)
  #     = github://esphome/micro-wake-word-models/models/v2/<name>.json
  #   - a local path to a custom manifest (relative to this yaml), or a github:// URL.
  # Custom "Penny" model (2026-09-29: Neo AND Riker dropped entirely, single-wake-word build).
  # Requires the ESPHome 2026.6.5 toolchain (pinned in pyproject.toml) — on 2025.11.4 the v2
  # tensor arena fails to allocate ("Failed to allocate tensors"). To fall back to a stock
  # trigger, set `okay_nabu`.
  #
  # 2026-09-29: VALIDATED v4 model (wake_words/penny_v4.{tflite,json}) — supersedes the v2
  # synthetic-only placeholder this file shipped with earlier the same day. Real-voice
  # session-disjoint holdout eval: recall flat at 0.88 with ZERO false accepts across the whole
  # 0.51-0.61 cutoff band at window 5 (the earlier "GATE FAILED" note on out/penny_v4.json was
  # from a window=3 run with mis-cut clips — stale, not carried into the manifest vendored here).
  # TO SWAP IN A FUTURE MODEL: point this substitution at the new manifest (or overwrite
  # penny_v4.{tflite,json} in place), then update wake_penny_cutoff_idle/_idle_int/_session_int
  # and wake_penny_window below to that model's own validated values. That is the full extent of
  # the swap, plus a rebuild.
  wake_word_model: wake_words/penny_v4.json
  # Penny cutoff/window — single source of truth so the swap above is a one-line-per-value change.
  # 2026-09-29 v4.2 RETUNE: office false-woke twice in 6 min at idle 0.61 (window 5) — one false
  # accept transcribed as ordinary room speech. The real-voice holdout eval
  # (~/neo-wakeword/eval_real_v4_recut_holdout.log, window 5) shows recall flat at 0.84 from
  # cutoff 0.63 up to 0.85 (0.88 at 0.51-0.61, 0.80 at 0.87-0.89, 0.76 at 0.91) — raising idle to
  # 0.85 costs ~1 clip of recall and should cut the false-wake rate. Session/barge-in moves to
  # 0.61 (was 0.56) — still inside the flat-recall band, mic is already open so a slightly
  # stricter bar there is cheap. int(probability * 255): 0.85 -> 217, 0.61 -> 155.
  # NOTE: ESPHome quantizes this float form via int(x*255) — TRUNCATION, not rounding
  # (micro_wake_word/__init__.py). 0.85*255=216.75 truncates to 216, one shy of the target 217
  # that drives the actual idle_int below — use 0.851 (217.005 -> 217) so the model's initial
  # construction-time cutoff (before any script.execute ever runs) already matches idle_int.
  wake_penny_cutoff_idle: "0.851"         # float form, for the models: list entry below
  wake_penny_cutoff_idle_int: "217"       # 0.85 quantized — idle tier for the lambdas
  wake_penny_cutoff_session_int: "155"    # 0.61 quantized — session/barge-in tier
  # Sliding window: 5 (NOT 8 — a window of 8 made the PE deaf; see memory
  # wake-sliding-window-sizing.md, "known-good floor: 5", also what the kitchen Sat1 runs).
  # Overridden inline in the models: entry below so it applies regardless of what the manifest
  # JSON says (belt-and-suspenders — the manifest also carries 5).
  wake_penny_window: "5"

esphome:
  name: ha-voice-openai
  friendly_name: Home Assistant OpenAI Realtime Voice
  name_add_mac_suffix: true
  min_version: 2025.11.0
  project:
    name: Neo.OfficeVoicePE
    version: ${esp32_fw_version}
  on_boot:
    priority: 375
    then:
      - script.execute: control_leds
      - delay: 1s
      - switch.turn_on: internal_speaker_amp
      # Start the wake word INDEPENDENT of Home Assistant. This device's voice loop runs over the
      # session-server WebSocket, not HA — but micro_wake_word was only started by
      # api.on_client_connected, so whenever the device wasn't adopted in HA the wake word was dead
      # (no wake word). Start it here once voice_kit is up (~a few seconds after boot). The api
      # handler below still (idempotently) starts it too, so an HA connection is a bonus, not a
      # requirement.
      #
      # 2026-09-29: Penny-only build — back to a single model, so the dual-wake
      # micro_wake_word.enable_model dance (needed only for the SECOND+ model in `models:`,
      # esphome/components/micro_wake_word/__init__.py: `default_enabled = i == 0`) is gone.
      # Penny is the sole/first model and auto-enables on first boot the way Neo alone used to.
      - delay: 4s
      - micro_wake_word.start:
          id: mww
      - lambda: |-
          id(init_in_progress) = false;
          id(voice_assistant_phase) = ${voice_assist_idle_phase_id};  // idle baseline w/o HA
          id(pe_intercom).set_temporary_dnd(false);
          id(pe_intercom).set_persisted_allow_drop_in(true);
      - script.execute: control_leds

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # Intercom keeps one pinned-TLS control socket open. Allocate its TLS and
      # WebSocket buffers only while they are actively carrying a frame so the
      # I2S speaker can still obtain DMA-capable internal RAM when Neo replies.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"
      CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN: "4096"
      CONFIG_ESP_WS_CLIENT_ENABLE_DYNAMIC_BUFFER: "y"
      CONFIG_WS_DYNAMIC_BUFFER: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  # Disable WiFi modem-sleep. ESPHome defaults to power_save_mode: LIGHT, which parks the radio
  # between DTIM beacons; the Sendspin music stream's aiohttp heartbeat (hardcoded 30 s in
  # aiosendspin, so its PONG deadline is 15 s and NOT a Music Assistant knob) then misses its
  # deadline and Music Assistant marks the player unavailable — music dropped every ~15 min on the
  # Sat1s for exactly this reason. Tell: the cadence is regular and it fires even with no music
  # playing. Same fix already flashed to the kitchen Sat1 (common/wifi_improv.yaml).
  power_save_mode: none
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

network:

logger:
  level: DEBUG
  logs:
    sensor: WARN
    voice_assistant_websocket: DEBUG

api:
  id: api_id
  # Standalone device (not managed by Home Assistant): disable ESPHome's default 15-min
  # "no API client connected → reboot to recover" watchdog. With no HA, the only API client is
  # `esphome logs`; when it's not running the device would otherwise self-reboot every ~15 min
  # (Reset Reason: "Reboot request from api"). 0s = never reboot on an idle API.
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: control_leds
    # Start micro_wake_word when API connects (ensures it's ready). Penny-only build: no
    # second-model enable_model call needed (see on_boot above).
    - micro_wake_word.start:
        id: mww
  on_client_disconnected:
    - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

globals:
  # Global index for LED animations
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  # Global initialization variable
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing the state of ImprovBLE
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  # Wake-word enrollment in progress (docs/wakeword_flywheel_plan.md Phase 3). Set/cleared by
  # on_enroll_start/on_enroll_stop below. Read by the mww watchdog interval so it doesn't
  # re-arm micro_wake_word mid-enrollment (on_enroll_start deliberately stops mww so guided
  # reps don't self-trigger; without this flag the 30s watchdog reads that as "mww not
  # running while idle+unmuted" and restarts it out from under the enrollment).
  - id: wake_enrolling
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the phase of the voice assistant
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  # Global variable tracking if the dial was recently touched
  - id: dial_touched
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the LED color was recently changed
  - id: color_changed
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the jack has been plugged recently
  - id: jack_plugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the jack has been unplugged recently
  - id: jack_unplugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    id: pe_intercom_allow_drop_in
    name: Office PE Intercom Allow Drop-In
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(pe_intercom).set_persisted_allow_drop_in(true);
    turn_off_action:
      - lambda: id(pe_intercom).set_persisted_allow_drop_in(false);
  - platform: template
    id: pe_intercom_dnd
    name: Office PE Intercom DND
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(pe_intercom).set_temporary_dnd(true);
    turn_off_action:
      - lambda: id(pe_intercom).set_temporary_dnd(false);
  # Master mute switch
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute
    entity_category: config
    lambda: |-
      // Muted either if the hardware mute switch is on or the microphone's software mute switch is enabled
      if (id(hardware_mute_switch).state || id(i2s_mics).get_mute_state()) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.mute:
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.unmute:
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds
  # Wake Word Sound Switch
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    pin: GPIO47
    id: internal_speaker_amp
    name: "Internal speaker amp"
    entity_category: config
    restore_mode: ALWAYS_OFF
    internal: true

binary_sensor:
  # Center Button
  - platform: gpio
    id: center_button
    pin:
      number: GPIO0
      inverted: true
    on_press:
      - script.execute: control_leds
    on_release:
      - script.execute: control_leds
    on_multi_click:
      # Simple Click: Start/Stop Voice Assistant
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - logger.log:
              format: "Button clicked - checking conditions"
              level: INFO
          - if:
              condition:
                neo_intercom.is_active:
                  id: pe_intercom
              then:
                - logger.log:
                    format: "Button clicked - hanging up intercom"
                    level: INFO
                - neo_intercom.hangup:
                    id: pe_intercom
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(pe_intercom).has_call_ownership();
              then:
                - logger.log:
                    format: "init_in_progress is false, checking voice assistant state"
                    level: INFO
                - if:
                    condition:
                      voice_assistant_websocket.is_running:
                        id: voice_assistant_ws
                    then:
                      # Fast single-press cancel shortly after a wake with NO reply audio yet
                      # = the wake was unwanted. Flag it as a false trigger for retraining
                      # before we tear the session down. (The condition self-gates, so a press
                      # during a real turn just stops normally without mislabeling it.)
                      - if:
                          condition:
                            voice_assistant_websocket.turn_has_no_reply_audio:
                              id: voice_assistant_ws
                          then:
                            - logger.log:
                                format: "Fast cancel with no reply audio - sending button_cancel"
                                level: INFO
                            - voice_assistant_websocket.button_cancel:
                                id: voice_assistant_ws
                      - logger.log:
                          format: "Voice assistant is running - stopping"
                          level: INFO
                      - voice_assistant_websocket.stop:
                          id: voice_assistant_ws
                    else:
                      - logger.log:
                          format: "Voice assistant is not running - checking mute switch"
                          level: INFO
                      - if:
                          condition:
                            switch.is_off: master_mute_switch
                          then:
                            - logger.log:
                                format: "Mute switch is OFF - starting voice assistant"
                                level: INFO
                            - voice_assistant_websocket.start:
                                id: voice_assistant_ws
                          else:
                            - logger.log:
                                format: "Voice assistant blocked: device is muted"
                                level: WARN
              else:
                - logger.log:
                    format: "init_in_progress is true - blocking voice assistant start"
                    level: INFO
      # Double Click
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed);
              then:
                - event.trigger:
                    id: button_press_event
                    event_type: "double_press"
                # Wake-word flywheel: a double-press means "that was a false trigger".
                # Only meaningful with a live session/WS; the action no-ops if not connected.
                - if:
                    condition:
                      voice_assistant_websocket.is_connected:
                        id: voice_assistant_ws
                    then:
                      - voice_assistant_websocket.false_flag:
                          id: voice_assistant_ws
      # Triple Click
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed);
              then:
                - event.trigger:
                    id: button_press_event
                    event_type: "triple_press"
      # Long Press
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed);
              then:
                - light.turn_off: voice_assistant_leds
                - event.trigger:
                    id: button_press_event
                    event_type: "long_press"

  # Hardware mute switch (Side of the device)
  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin: GPIO3
    on_press:
      - if:
          condition:
            - switch.is_off: master_mute_switch
          then:
            - microphone.mute:
    on_release:
      - microphone.unmute:
  # Audio Jack Plugged sensor
  - platform: gpio
    id: jack_plugged
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    pin:
      number: GPIO17
    on_press:
      - lambda: id(jack_plugged_recently) = true;
      - script.execute: control_leds
      - delay: 800ms
      - lambda: id(jack_plugged_recently) = false;
      - script.execute: control_leds
    on_release:
      - lambda: id(jack_unplugged_recently) = true;
      - script.execute: control_leds
      - delay: 800ms
      - lambda: id(jack_unplugged_recently) = false;
      - script.execute: control_leds
  # Voice Assistant Connection Status
  - platform: template
    name: "Voice Assistant Connected"
    id: voice_assistant_connected
    lambda: |-
      return id(voice_assistant_ws).is_connected();
  - platform: template
    id: pe_intercom_speaker_available
    internal: true
    lambda: |-
      return id(pe_intercom).is_intercom_output_available() &&
             !id(voice_assistant_ws).is_running() &&
             id(voice_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING &&
             id(voice_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;

light:
  # Hardware LED ring
  - platform: esp32_rmt_led_strip
    id: leds_internal
    pin: GPIO21
    chipset: WS2812
    max_refresh_rate: 15ms
    num_leds: 12
    rgb_order: GRB
    rmt_symbols: 192
    default_transition_length: 0ms
    power_supply: led_power

  # Voice Assistant LED ring (remapping of internal LED)
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6
    effects:
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 100ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      - addressable_lambda:
          name: "Thinking"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Replying"
          update_interval: 50ms
          lambda: |-
            id(global_led_animation_index) = (12 + id(global_led_animation_index) - 1) % 12;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == (id(global_led_animation_index)) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 1) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 2) % 12) {
                it[i] = color * 128;
              } else if (i == ( id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 7) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 8) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
      - addressable_lambda:
          name: "Active Pulse"
          update_interval: 50ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_increasing = true;
            static uint8_t brightness_steps = 20;  // Number of steps for smooth pulse
            if (initial_run) {
              brightness_step = 0;
              brightness_increasing = true;
            }
            // Blue color (0, 0, 255)
            Color blue(0, 0, 255);
            uint8_t brightness = (brightness_step * 255) / brightness_steps;
            Color pulse_color = blue * brightness;
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = pulse_color;
            }
            if (brightness_increasing) {
              brightness_step++;
              if (brightness_step >= brightness_steps) {
                brightness_increasing = false;
              }
            } else {
              brightness_step--;
              if (brightness_step == 0) {
                brightness_increasing = true;
              }
            }
      - addressable_lambda:
          name: "Muted or Silent"
          update_interval: 16ms
          lambda: |-
            Color muted_color(255, 0, 0);
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if ( light_color.get_state() ) {
                it[i] = color;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if ( id(master_mute_switch).state ) {
              it[2] = Color::BLACK;
              it[3] = muted_color;
              it[4] = Color::BLACK;
              it[8] = Color::BLACK;
              it[9] = muted_color;
              it[10] = Color::BLACK;
            }
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            Color error_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Voice kit startup failed"
          lambda: |-
            Color fail_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              if (i % 3) {
                it[i] = Color::BLACK;
              } else {
                it[i] = fail_color;
              }
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%

  # User facing LED ring
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6

power_supply:
  - id: led_power
    pin: GPIO45

sensor:
  # The dial (rotary encoder) - for volume control
  - platform: rotary_encoder
    id: dial
    pin_a: GPIO16
    pin_b: GPIO18
    resolution: 2
    on_clockwise:
      - lambda: id(dial_touched) = true;
      - script.execute:
          id: control_volume
          increase_volume: true
      - script.execute: control_leds
    on_anticlockwise:
      - lambda: id(dial_touched) = true;
      - script.execute:
          id: control_volume
          increase_volume: false
      - script.execute: control_leds

event:
  # Event entity for button presses
  - platform: template
    id: button_press_event
    name: "Button press"
    icon: mdi:button-pointer
    device_class: button
    event_types:
      - double_press
      - triple_press
      - long_press

script:
  # Master script controlling the LEDs
  - id: control_leds
    then:
      - lambda: |
          if (id(improv_ble_in_progress)) {
            id(control_leds_improv_ble_state).execute();
          } else if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(wifi_id).is_connected()){
            // HA-independent: the ring's "no connection" state depends on WiFi only (needed to
            // reach session-server). It used to also require the HA api connection, which stuck
            // the ring on this state whenever the PE wasn't in HA — masking all voice colors.
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(center_button).state) {
            id(control_leds_center_button_touched).execute();
          } else if (id(jack_plugged_recently)) {
            id(control_leds_jack_plugged_recently).execute();
          } else if (id(jack_unplugged_recently)) {
            id(control_leds_jack_unplugged_recently).execute();
          } else if (id(dial_touched)) {
            id(control_leds_dial_touched).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(control_leds_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(control_leds_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(control_leds_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(control_leds_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(control_leds_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(control_leds_voice_assistant_not_ready_phase).execute();
          } else if (id(master_mute_switch).state) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(control_leds_voice_assistant_idle_phase).execute();
          }

  # Script executed during Improv BLE
  - id: control_leds_improv_ble_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 89%
          blue: 71%
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed during initialization
  - id: control_leds_init_state
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                brightness: 66%
                red: 9.4%
                green: 73.3%
                blue: 94.9%
                id: voice_assistant_leds
                effect: "Twinkle"
          else:
            - light.turn_on:
                brightness: 66%
                red: 100%
                green: 89%
                blue: 71%
                id: voice_assistant_leds
                effect: "none"

  # Script executed when the device has no connection to Home Assistant
  - id: control_leds_no_ha_connection_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the voice assistant is idle
  # If voice assistant is running AND connected, show blue pulse; otherwise turn off
  - id: control_leds_voice_assistant_idle_phase
    then:
      - if:
          condition:
            and:
              - voice_assistant_websocket.is_running:
                  id: voice_assistant_ws
              - voice_assistant_websocket.is_connected:
                  id: voice_assistant_ws
          then:
            # Voice assistant is active and connected - show blue pulse
            - light.turn_on:
                brightness: 66%
                red: 0%
                green: 0%
                blue: 100%
                id: voice_assistant_leds
                effect: "Active Pulse"
          else:
            # Voice assistant is not active or not connected - turn off
            - light.turn_off: voice_assistant_leds
            - if:
                condition:
                  light.is_on: led_ring
                then:
                  light.turn_on: led_ring

  # Script executed when the voice assistant is waiting for a command
  - id: control_leds_voice_assistant_waiting_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Waiting for Command"

  # Script executed when the voice assistant is listening to a command
  - id: control_leds_voice_assistant_listening_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Listening For Command"

  # Script executed when the voice assistant is thinking
  - id: control_leds_voice_assistant_thinking_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Thinking"

  # Script executed when the voice assistant is replying
  - id: control_leds_voice_assistant_replying_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Replying"

  # Script executed when the voice assistant is in error
  - id: control_leds_voice_assistant_error_phase
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Error"

  # Script executed if voice_kit startup failed
  - id: control_leds_voice_kit_startup_failed
    then:
      - light.turn_on:
          brightness: 40%
          red: 0%
          green: 0%
          blue: 0%
          id: voice_assistant_leds
          effect: "Voice kit startup failed"

  # Script executed when the voice assistant is muted or silent
  - id: control_leds_muted_or_silent
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Muted or Silent"

  # Script executed when the voice assistant is not ready
  - id: control_leds_voice_assistant_not_ready_phase
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the dial is touched
  - id: control_leds_dial_touched
    then:
      - delay: 1s
      - lambda: id(dial_touched) = false;
      - script.execute: control_leds

  # Script executed when the jack has just been plugged
  - id: control_leds_jack_plugged_recently
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "none"

  # Script executed when the jack has just been unplugged
  - id: control_leds_jack_unplugged_recently
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "none"

  # Script executed when the center button is touched
  - id: control_leds_center_button_touched
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "none"

  # Script executed when the volume is increased/decreased from the dial
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool  # True: Increase volume / False: Decrease volume.
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up:
                id: voice_media_player
          else:
            - media_player.volume_down:
                id: voice_media_player
      - script.execute: control_leds
      - delay: 1s
      - lambda: id(dial_touched) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds

  # NEO (Stage B): the `play_sound` script was removed here. It was already dead code — its only
  # caller was the wake chime, dropped when Neo went silent-on-wake — and it called
  # `play_file(audio::AudioFile*)`, an API of the old `speaker` media_player platform that
  # `speaker_source` does not expose. To bring a chime back, play the announcement pipeline's
  # audio_file media_source via `media_player.play_media` instead of resurrecting this.

# I2S Audio Input (Microphone) - Voice PE Hardware
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
    i2s_bclk_pin:
      number: GPIO8

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO14
    i2s_bclk_pin:
      number: GPIO13

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000  # micro_wake_word requires 16kHz; we resample to 24kHz in code for OpenAI API
    bits_per_sample: 32bit  # Voice PE hardware uses 32-bit (matches original HA Voice config)
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo  # Must be stereo for micro_wake_word (channels: 1), we convert to mono in code

# Audio DAC (AIC3204) - Voice PE Hardware
audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

# I2S Audio Output (Speaker) - Voice PE Hardware
speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000  # Voice PE hardware expects 48kHz (matches original HA Voice config)
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit  # Voice PE hardware expects 32-bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo  # Voice PE hardware expects stereo
    timeout: never
    # The local I2S component uses five 5 ms hardware DMA blocks (25 ms total),
    # halving the hard-coded upstream internal-RAM cost. This 50 ms software
    # ring lives in PSRAM and continues to absorb scheduler jitter.
    buffer_duration: 50ms
    audio_dac: aic3204_dac
  
  # Virtual speaker to combine announcement and media streams together into one output
  # This enables ducking functionality (lowering media volume when voice assistant speaks)
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
  
  # Resampler for voice assistant announcements (24kHz -> 48kHz)
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  
  # Resampler for voice assistant audio (24kHz -> 48kHz)
  # Used directly by voice_assistant_websocket component
  - platform: resampler
    id: voice_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000  # Output sample rate
    bits_per_sample: 16
    buffer_duration: 500ms   # 7/12 known-good (was bumped to 2000ms; that RAM starved micro_wake_word). PSRAM ring buffer absorbs bursts now.

# Audio files available to the media player's announcement pipeline. Moved out of the
# media_player's old `files:` key, which only the `speaker` platform supports.
audio_file:
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}

# Sendspin — Music Assistant's native streaming protocol (an Open Home Foundation protocol).
# The MA server connects to THIS DEVICE directly over WebSocket (mDNS-discovered); Home
# Assistant is nowhere in the path. Built into ESPHome 2026.6.5, so no external_components.
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true   # PE internal RAM is tight — micro_wake_word's tensor arena
                              # lives there and has starved before. Keep this task off it.

media_source:
  - platform: audio_file
    id: announcement_audio_file_source
  - platform: sendspin
    id: sendspin_media_source

# Media Player for voice assistant audio output (like original HA Voice)
media_player:
  # Controller-facing player Music Assistant uses for grouping / multi-room. It takes no
  # speaker of its own — the actual audio flows through sendspin_media_source into the
  # pipeline of voice_media_player below.
  - platform: sendspin
    id: sendspin_group_media_player

  # NEO (Stage B): migrated from `platform: speaker` to `platform: speaker_source`. Only
  # speaker_source accepts `sources:`, which is the socket the sendspin media_source plugs
  # into; the old `speaker` platform has `files:` and no sources at all.
  - platform: speaker_source
    id: voice_media_player
    name: Media Player
    internal: False
    volume_increment: 0.05
    volume_min: 0.4  # Minimum volume (40%) - matches original HA Voice config
    volume_max: 0.85  # Maximum volume (85%) - matches original HA Voice config
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: WAV  # WAV for OpenAI audio (24kHz, mono)
      num_channels: 1  # Mono (like original) - resampler will handle conversion
      sample_rate: 24000  # Input sample rate from OpenAI (24kHz) - resampler will convert to 48kHz
      # `sources` is REQUIRED per pipeline on speaker_source. Nothing plays the wake chime today
      # (Neo wakes silently), but keeping it wired means re-adding a tone stays a one-liner.
      sources:
        - announcement_audio_file_source
    media_pipeline:
      speaker: media_mixing_input
      format: FLAC  # FLAC is the least processor intensive codec
      num_channels: 2
      sample_rate: 48000
      # Where Music Assistant's audio arrives. The two pipelines must not share a speaker or a
      # source — announcement is the audio_file source above, media is sendspin.
      sources:
        - sendspin_media_source
    on_mute:
      - script.execute: control_leds
    on_unmute:
      - script.execute: control_leds
    on_volume:
      - script.execute: control_leds
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20  # Lower media volume by 20dB when voice assistant speaks
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant_websocket.is_running:
                  id: voice_assistant_ws
            # Must name the player explicitly now that sendspin_group_media_player is also a
            # media_player — a bare id is ambiguous and fails config validation.
            - not:
                media_player.is_announcing: voice_media_player
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0  # Restore media volume
              duration: 1.0s

# Wake Word Detection
micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  models:
    # Primary (and only) wake word — driven by the ${wake_word_model} substitution above.
    #
    # 2026-09-29: Neo AND Riker dropped entirely — Penny is now the single wake word on every
    # Neo satellite (this PE + both Sat1s). The dual-wake infrastructure (a second models: entry,
    # the riker_wake_word id, its own set_probability_cutoff tier lambdas, the boot-time
    # enable_model call) is removed outright rather than left dormant, per riker_migration_plan.md
    # being superseded — see git history (275420d/3deb688 added Riker; this branch removes it)
    # if that plan or Riker's tuning notes are ever needed again.
    #
    # Cutoff/window history for this slot: the original "Neo" model went 0.98 -> 0.90 (fixed
    # barge-in, broke idle) -> 0.96 (fixed idle, broke barge-in) -> split by session state (see
    # voice_assistant_websocket's on_connected/on_disconnected/on_stopped/on_error below) once it
    # became clear ONE static cutoff can't serve both "strict enough idle" and "loose enough to
    # hear the word over its own TTS residual." That same 2-tier (idle/session) split carries over
    # unchanged below, now scoped to Penny. The window axis is independent of the cutoff axis
    # (detection = mean(recent_probabilities) > cutoff, so widening the window silently RAISES the
    # effective bar): windows of 12 then 8 were both tried for Neo, 12 made the PE deaf outright;
    # this build goes straight to 5, the known-good floor the kitchen Sat1 has run reliably
    # (memory: wake-sliding-window-sizing.md). See the substitutions block above for the
    # single-source-of-truth cutoff/window values and the v4-model swap-in instructions.
    - model: ${wake_word_model}
      id: primary_wake_word
      probability_cutoff: ${wake_penny_cutoff_idle}   # validated v4 real-voice eval (0.51-0.61 band)
      sliding_window_size: ${wake_penny_window}
    # Extra triggers disabled for this build — uncomment to also wake on these:
    # - model: hey_jarvis
    #   id: hey_jarvis
    # - model: hey_mycroft
    #   id: hey_mycroft
  vad:
  on_wake_word_detected:
    - if:
        condition:
          and:
            - switch.is_off: master_mute_switch
            - not:
                neo_intercom.is_active:
                  id: pe_intercom
        then:
          # Barge-in FIRST — before the chime. If mid-reply, "Penny" must cut it in ~a WS
          # round-trip, not ~1s later. A re-wake NEVER disconnects the session — interrupt() leaves
          # it RUNNING (and opens the mic for the follow-up) so your next request is heard right away.
          - if:
              condition:
                and:
                  - voice_assistant_websocket.is_running:
                      id: voice_assistant_ws
                  - voice_assistant_websocket.is_bot_speaking:
                      id: voice_assistant_ws
              then:
                - voice_assistant_websocket.interrupt:
                    id: voice_assistant_ws
          # Cold wake: START the session BEFORE the chime, so the WS connect runs *underneath* the
          # chime instead of after it. The mic then opens after wake per the component's own
          # mic-open delay (compiled-in default, overridable at runtime by the session-server's
          # `hello` frame — see the substitutions block above), not chime + delay + connect — which
          # used to eat the front of your first command. A mid-session re-wake stays open (handled
          # above).
          - if:
              condition:
                not:
                  voice_assistant_websocket.is_running:
                    id: voice_assistant_ws
              then:
                - voice_assistant_websocket.start:
                    id: voice_assistant_ws
          # NEO: wake silently — no wake chime (parity with the Sat1; Matt doesn't want Neo to chime on
          # wake). Was: play_sound(wake_word_triggered_sound) gated on the wake_sound switch. Removed so
          # Neo wakes silent on all hardware. Re-add only if a wake tone is wanted again.

# External Components - Custom voice_assistant_websocket component
external_components:
  # Custom Voice Assistant WebSocket Component — local, since we build from the full
  # fork checkout (esphome/components/ sits right next to this yaml). No token needed.
  # (For building on HA where only the yaml is copied, use a git source instead — see
  # OPTION_2 / git history for the token-based variant.)
  - source:
      type: local
      path: esphome/components
    components: [voice_assistant_websocket, i2s_audio]
  # Shared Neo intercom transport plus its source-owned output reservation
  # adapters. The PE profile replaces only Satellite1-specific hardware hooks.
  - source:
      type: local
      path: ../../neo-audit-fixes/satellite1-release-r21/esphome/components
    components: [neo_intercom, satellite1, tas2780, fusb302b]
  # Voice PE Hardware Components
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: 25.11.0
    components:
      - voice_kit
    refresh: 0s

neo_intercom:
  id: pe_intercom
  enabled: !secret intercom_relay_enabled
  startup_delay: 20s
  allow_drop_in: !secret intercom_relay_allow_drop_in
  device_id: ${neo_intercom_device_id}
  hardware_profile: voice_pe
  hardware_identity: voice-pe-xmos-v1
  control_url: !secret intercom_control_url
  media_url: !secret intercom_media_url
  auth_token: !secret intercom_device_bearer_office
  pinned_ca: !secret intercom_server_ca_pem
  microphone: i2s_mics
  speaker: announcement_resampling_speaker
  speaker_available: pe_intercom_speaker_available
  mute_sensor: hardware_mute_switch
  i2s_sink: i2s_audio_speaker
  announcement_resampler: announcement_resampling_speaker
  media_resampler: voice_resampling_speaker
  mixer: mixing_speaker
  media_player: voice_media_player
  chime_dma_profile_verified: true

# Voice Assistant WebSocket Component
voice_assistant_websocket:
  id: voice_assistant_ws
  # Server URL - uses secret from secrets.yaml
  server_url: !secret server_url

  # Auto-stop the session after this long with no speaker (bot) audio. While the
  # session is open the mic streams to the backend (billed audio + live listening),
  # so keep this tight — re-wake with "Penny" for the next request. The old 120s was a
  # band-aid for the wake-word re-arm bug (now fixed); 15s = a slightly roomier close
  # than Alexa — re-wake with "Penny" for follow-ups. Accepts a time period ("15s") or raw ms.
  auto_stop_inactivity_ms: 15s

  # Audio input (microphone) - reference to I2S audio input
  microphone: i2s_mics
  
  # Audio output - use resampler speaker (media_player uses this for volume control)
  # We resample 24kHz -> 48kHz in code, then send to resampler which passes through
  speaker: voice_resampling_speaker
  
  # State callbacks for LED control
  on_connected:
    - lambda: id(init_in_progress) = false;
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};  # Set to idle to show blue pulse (only if running)
    - script.execute: control_leds
    # Apply ducking to media when voice assistant starts
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20  # Lower media volume by 20dB when voice assistant is active
        duration: 0.0s
    # Barge-in sensitivity, scoped to the session. The static probability_cutoff is a single knob
    # forced to serve two opposite jobs: strict enough that idle ambience doesn't false-wake, loose
    # enough to catch the wake word through the AEC residual of its own playback. Splitting it by
    # state removes the conflict: stay strict (idle) while idle, drop to the looser session tier
    # only for the duration of a session — which is the only time barge-in can happen anyway, and
    # when the mic is already open and streaming.
    # micro_wake_word exposes no YAML action for this, but WakeWordModel::set_probability_cutoff
    # is public and the cutoff is quantised as int(probability * 255) — see the substitutions block
    # (wake_penny_cutoff_idle_int / wake_penny_cutoff_session_int) for the single source of truth.
    - lambda: id(primary_wake_word).set_probability_cutoff(${wake_penny_cutoff_session_int});   # session — barge-in over playback
  on_disconnected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};  # turn ended → idle (ring off), NOT not_ready (red). Red is reserved for WiFi-down.
    - script.execute: control_leds
    # Ensure micro_wake_word continues running after disconnect
    - micro_wake_word.start:
        id: mww
    # Restore media volume when voice assistant stops
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - lambda: id(primary_wake_word).set_probability_cutoff(${wake_penny_cutoff_idle_int});   # back to strict idle
  on_stopped:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};  # turn ended → idle (ring off), NOT not_ready (red). Red is reserved for WiFi-down.
    - script.execute: control_leds
    # Restore media volume when voice assistant stops
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - lambda: id(primary_wake_word).set_probability_cutoff(${wake_penny_cutoff_idle_int});   # back to strict idle
  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
          # Restore media volume on error
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    # Deliberately OUTSIDE the init guard above: a stranded loose cutoff means the device
    # false-wakes on ambience forever, so restore it on every error path without exception.
    - lambda: id(primary_wake_word).set_probability_cutoff(${wake_penny_cutoff_idle_int});   # back to strict idle
  # Wake-word enrollment mode (docs/wakeword_flywheel_plan.md Phase 3). The C++ owns the
  # mic-pin + 15-min safety cap + WS-drop restore; the YAML just disarms/re-arms the wake
  # model so guided reps ("Penny, Penny, Penny...") don't self-trigger while streaming.
  #
  # 2026-09-27 FIX (empty-enrollment-WAV / orphan-coach bug, a5099d6): this used to call
  # `micro_wake_word.stop()` here. micro_wake_word owns its mic access through its OWN
  # `microphone::MicrophoneSource`, whose `stop()` calls straight through to the shared
  # `Microphone::stop()` (esphome/components/microphone/microphone_source.cpp) with NO
  # reference counting against other consumers. voice_assistant_websocket holds a raw
  # `microphone::Microphone *` to that SAME `i2s_mics` component (not its own MicrophoneSource),
  # so stopping mww during enrollment could stop the physical mic out from under the enrollment
  # recorder too -- `enter_enrollment_()`'s own `microphone_->start()` guard runs too early (in the
  # websocket task, before this deferred trigger even fires) to protect against it. Confirmed via a
  # live diagnostic (session-server enroll.py instrumented 2026-09-26/27): zero mic frames reached
  # the recorder after enroll start, and the device then dropped its WS entirely -- a hard reboot
  # from an I2S fault sharing the bus with active speaker (coach TTS) output is the leading theory,
  # though the mic-starvation on its own already explains the empty WAV regardless.
  #
  # Fix: never stop mww here at all -- raise the model's cutoff to (quantized) 1.0, i.e.
  # unreachable, the same session-scoped-cutoff mechanism already used for barge-in sensitivity
  # elsewhere in this file (WakeWordModel::set_probability_cutoff). mww keeps running (and keeps
  # its OWN mic source open) throughout enrollment; a rep audibly matching "Penny" simply can
  # never cross an impossible bar, so it can't self-trigger, and the shared mic is never touched.
  # Restore to the normal idle cutoff on stop (the same value on_error/on_disconnected/on_stopped
  # restore to).
  on_enroll_start:
    - lambda: id(wake_enrolling) = true;
    - logger.log:
        format: "Enrollment start - raising wake cutoff to unreachable (mic stays owned by voice_assistant_websocket, not stopped)"
        level: INFO
    - lambda: |-
        id(primary_wake_word).set_probability_cutoff(255);
  on_enroll_stop:
    - lambda: id(wake_enrolling) = false;
    - logger.log:
        format: "Enrollment stop - restoring idle wake cutoff"
        level: INFO
    - lambda: |-
        id(primary_wake_word).set_probability_cutoff(${wake_penny_cutoff_idle_int});   // back to strict idle

# Voice Kit Component - Voice PE Hardware (XMOS Firmware)
# The XMOS XU316 chip has built-in audio processing support:
# - AEC (Acoustic Echo Cancellation): Removes echo from speaker output
# - AGC (Auto Gain Control): Automatically adjusts microphone gain for consistent volume
# - NS (Noise Suppression): Reduces background noise
# Note: AEC is always active in hardware. channel_stage selects ADDITIONAL processing.
# Match the stock Nabu Casa config: NO channel_stage (no AGC/NS). AGC re-amplifies the residual
# echo the AEC couldn't fully cancel → breaks barge-in (echo false-triggers the VAD and masks the
# user's voice). Leaving these unset uses the clean AEC-only output, as the proven stock firmware does.
voice_kit:
  id: voice_kit_component
  i2c_id: internal_i2c
  reset_pin: GPIO4
  # 7/12 known-good XMOS channel processing (AEC always on in HW; these add AGC/NS). Removing them
  # was part of the full-duplex barge-in experiment we've since dropped for wake-word barge-in.
  channel_0_stage: AGC
  channel_1_stage: NS
  firmware:
    url: https://github.com/esphome/voice-kit-xmos-firmware/releases/download/v1.3.1/ffva_v1.3.1_upgrade.bin
    version: "1.3.1"
    md5: 964635c5bf125529dab14a2472a15401

# Text sensor for debugging
text_sensor:
  - platform: template
    id: pe_intercom_runtime_status
    name: Office PE Intercom Runtime Status
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(pe_intercom).runtime_status();
  - platform: template
    name: "Voice Assistant Status"
    id: voice_assistant_status
    lambda: |-
      if (id(voice_assistant_ws).is_connected()) {
        return {"Connected"};
      } else if (id(voice_assistant_ws).is_running()) {
        return {"Connecting"};
      } else {
        return {"Idle"};
      }
    update_interval: 5s

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: false   # exposed in HA so the PE can be rebooted without a power-cycle
    icon: "mdi:restart"

# --- Wake-word reliability hardening (2026-07-10) ------------------------------
# The on-device "neo" detector was degrading across session cycles: after enough
# wake -> session -> auto-stop cycles the mic wasn't always handed cleanly back to
# micro_wake_word, so detection got progressively worse until a manual power-cycle.
# Two safety nets:
#   1) A watchdog that re-arms mww whenever the device is idle+unmuted but mww isn't
#      actually running (catches any missed re-arm at session-end).
#   2) A nightly reboot at 04:00 (only when idle) so heap never fragments over days.
interval:
  - interval: 30s
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(init_in_progress);"
              - lambda: "return !id(wake_enrolling);"
              - switch.is_off: master_mute_switch
              - not:
                  micro_wake_word.is_running:
          then:
            - logger.log:
                format: "Wake-word watchdog: mww not running while idle+unmuted — re-arming"
                level: WARN
            - micro_wake_word.start:
                id: mww

time:
  # NOT `platform: homeassistant` — this device is standalone (see the `api:` block above:
  # "not managed by Home Assistant", only client is `esphome logs`). The homeassistant time
  # platform is pushed by a genuine HA connection; with none, `ha_time` never syncs and the
  # 04:00 nightly reboot below never fires. sntp needs only WiFi + internet, both already
  # present. NOTE: no `timezone:` is set here — ESPHome falls back to auto-detecting it at
  # compile time, which is unreliable if the build runs off-site (e.g. CI); pin an explicit
  # `timezone:` string here if the 04:00 firing time turns out wrong.
  - platform: sntp
    id: ha_time
    on_time:
      # 04:00 local: reboot to clear heap, but only if no voice session is open.
      - seconds: 0
        minutes: 0
        hours: 4
        then:
          - if:
              condition:
                not:
                  voice_assistant_websocket.is_running:
                    id: voice_assistant_ws
              then:
                - logger.log:
                    format: "Nightly auto-reboot (04:00 idle) — clearing heap fragmentation"
                    level: INFO
                - button.press: restart_button

debug:
  update_interval: 5s
